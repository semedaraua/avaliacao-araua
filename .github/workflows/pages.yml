name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar versão aos arquivos locais (evita cache desatualizado no navegador/CDN)
        run: |
          sed -i -E 's/"(config|app|auth|relatorios|dashboard)\.js"/"\1.js?v=${{ github.sha }}"/g; s/"style\.css"/"style.css?v=${{ github.sha }}"/g' index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
